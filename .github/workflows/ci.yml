name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust scanner core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Format
        working-directory: RustCore
        run: cargo fmt --all -- --check

      - name: Lints
        working-directory: RustCore
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + FFI contract)
        working-directory: RustCore
        run: cargo test --workspace

      # The spec asks for a performance regression threshold in CI. The benchmark
      # run here is the smoke check; the threshold is applied by comparing the
      # criterion baseline against the recorded numbers.
      - name: Benchmarks compile and run
        working-directory: RustCore
        run: |
          cargo bench -p sift-scanner-core --no-run
          cargo bench -p sift-scanner-core --bench scan_stages -- --warm-up-time 0.3 --measurement-time 1

      - name: Universal build
        run: ./Scripts/build-rust-xcframework.sh --no-tests

      - name: Upload the XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: SiftScanner.xcframework
          path: Bridge/SiftScanner.xcframework

  swift:
    name: Swift app and tests
    # Not macos-14: the image ships Xcode 15, whose Swift 5.10 cannot read this
    # package's `swift-tools-version: 6.0`, and the job failed on its first
    # `swift build` with "package 'sift' is using Swift tools version 6.0.0 but
    # the installed version is 5.10.0". The project pins macOS 15 and the 16.x
    # Xcode line, so CI runs on that macOS and selects that Xcode explicitly
    # rather than taking whatever the image defaults to.
    runs-on: macos-15
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          # The newest 16.x the image has; if it ships only `Xcode.app` and that
          # is 16.x, the check below is what confirms it.
          for candidate in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r); do
            sudo xcode-select -s "${candidate}/Contents/Developer"
            break
          done
          swift --version
          if ! swift --version | grep -q 'Swift version 6\.'; then
            echo "::error::this package needs Swift 6 (Xcode 16.x); the runner has:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

      - name: Bootstrap (Rust archive, strings, Xcode project)
        run: ./Scripts/bootstrap.sh

      # The same generated-source gates `Scripts/verify.sh` runs. Without them
      # CI could stay green while a generated table, string catalog or
      # explanation key was stale.
      - name: Generated sources are current
        run: |
          python3 Scripts/generate-strings.py --check
          python3 Scripts/generate-protection.py --check
          python3 Scripts/generate-rules.py --check
          python3 Scripts/check-explanation-keys.py

      - name: Build the app with the Rust core linked
        run: swift build

      - name: Self-test suite
        run: swift run SiftSelfTest

      # XCTest is part of Xcode, which the runner image provides, so the real
      # framework runs the suite here rather than the Command Line Tools shim.
      - name: XCTest suite
        run: swift test

      # The runner the Command-Line-Tools-only path uses. Running it here as
      # well proves the shim still executes every test the real framework does.
      - name: Command-line test runner
        run: ./Scripts/run-tests.sh

      - name: Type-check the XCTest suite
        run: ./Scripts/check-tests.sh

      - name: Assemble the app bundle (SwiftPM)
        run: ./Scripts/build-app.sh

      # The same steps as Scripts/verify.sh, with the same flags, so a green CI
      # run means what a green local run means.
      #
      # No `-destination` on the build: given one, xcodebuild writes the UI
      # test's target application into the generated xctestrun as
      # `<products>/Debug/Sift`, without the `.app` suffix. The run needs one,
      # because it has to choose a runner.
      - name: "Xcode: build the test plan"
        run: |
          xcodebuild -project Sift.xcodeproj -scheme Sift -testPlan Sift \
            -derivedDataPath .build/xcode \
            build-for-testing -quiet

      - name: "Xcode: run the unit tests"
        run: |
          xcodebuild -project Sift.xcodeproj -scheme Sift -testPlan Sift \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath .build/xcode \
            test-without-building -only-testing:SiftTests -quiet

      # The UI target is retried once and its two outcomes are told apart, the
      # same way Scripts/verify.sh does it. Xcode 16.4's UI-test runner sometimes
      # fails to start at all — it looks for the target application at
      # `<products>/Debug/Sift`, a path with no `.app` on it, and the bundle is at
      # `<products>/Debug/Sift.app`; or it reports `failed to initialize for UI
      # testing (... Timed out while enabling automation mode.)`, which is the
      # automation grant rather than the code — so no test case executes in
      # either case. A *test* that fails fails this job; a runner that never
      # started is reported as such. Claiming "passed" for a run that never
      # executed would be dishonest, and so would failing a build because Xcode
      # did not start a process.
      #
      # Each attempt is bounded: a wedged runner once sat for thirteen minutes
      # without a verdict, and a gate nobody waits for is not a gate.
      - name: "Xcode: run the UI tests"
        run: |
          set -uo pipefail
          ui_state="did not run"
          deadline=300
          for attempt in 1 2; do
            xcodebuild -project Sift.xcodeproj -scheme Sift -testPlan Sift \
              -destination "platform=macOS,arch=$(uname -m)" \
              -derivedDataPath .build/xcode \
              test-without-building -only-testing:SiftUITests > /tmp/ui-attempt.log 2>&1 &
            pid=$!
            waited=0
            while kill -0 "${pid}" 2>/dev/null; do
              if [ "${waited}" -ge "${deadline}" ]; then
                echo "the runner hung for ${deadline}s and was stopped; no test ran" >> /tmp/ui-attempt.log
                kill "${pid}" 2>/dev/null || true
                break
              fi
              sleep 5
              waited=$(( waited + 5 ))
            done
            if wait "${pid}"; then
              ui_state="ran"
              echo "the UI target ran on attempt ${attempt}"
              break
            fi
            if grep -q "failed on '" /tmp/ui-attempt.log; then
              echo "::error::the UI target ran and a test failed"
              tail -60 /tmp/ui-attempt.log
              exit 1
            fi
            if grep -q "the runner hung for" /tmp/ui-attempt.log \
              || grep -q "SiftUITests encountered an error" /tmp/ui-attempt.log \
              || grep -q "failed to initialize for UI testing" /tmp/ui-attempt.log; then
              echo "attempt ${attempt}: no test ran (the runner did not start, or it was stopped)"
            else
              echo "::error::the UI target failed in a way this step does not recognise"
              tail -60 /tmp/ui-attempt.log
              exit 1
            fi
          done
          if [ "${ui_state}" != "ran" ]; then
            echo "::error::Xcode's UI-test runner did not start on either attempt; no UI test executed"
            exit 1
          fi
          echo "UI tests: ${ui_state}"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Sift.app
          path: .build/Sift.app
