[package]
name = "sift-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
sift-rules = { workspace = true }
sift-scanner-core = { workspace = true }
sift-file-index = { workspace = true }
sift-hasher = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The contract tests build real directory trees, so they need the core crate's
# fixtures. Release builds never enable this feature.
[dev-dependencies]
sift-scanner-core = { workspace = true, features = ["test-fixtures"] }
