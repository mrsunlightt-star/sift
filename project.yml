# XcodeGen specification.
#
# Run `Scripts/bootstrap.sh` (or `xcodegen generate`) after changing this file.
# `Sift.xcodeproj` is generated from here and checked in, so a developer with
# Xcode can open it without installing XcodeGen first.
#
# Why a generated project rather than a hand-maintained one: the SwiftPM package
# already defines the module graph, and this file only adds what a package cannot
# express — an app bundle, an Info.plist, entitlements, an asset catalog, a test
# plan and a UI test bundle. Keeping that small and declarative means the two
# build paths cannot drift.

name: Sift
options:
  bundleIdPrefix: com.siftmac
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  SiftModules:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Ad-hoc signing keeps a fresh checkout buildable; a release pipeline
    # overrides these with a Developer ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # The Rust archive is a static library whose symbols must all be present:
    # the app references a subset, and dead-stripping would drop the rest.
    DEAD_CODE_STRIPPING: NO

targets:
  Sift:
    type: application
    platform: macOS
    sources:
      - path: App/Entry
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Sift
        PRODUCT_BUNDLE_IDENTIFIER: com.siftmac.cleaner
        INFOPLIST_FILE: Config/Info.plist
        # Not Xcode 16's debug dylib. That mode builds the app as a small
        # launcher plus `Sift.debug.dylib`, and the runner reassembles the pair
        # while the UI test is being set up — the app bundle then changes after
        # it was signed, and the run fails with "The bundle identifier for Sift
        # couldn't be read. No such file or directory: .../Debug/Sift". A UI
        # test needs one fully linked, signed bundle, so the setting is off for
        # every configuration rather than only for the test action.
        ENABLE_DEBUG_DYLIB: NO
        # Swap this to Config/Sift-AppStore.entitlements for a sandboxed Mac App
        # Store build (§12.4). It is a target setting, so it cannot be a scheme.
        CODE_SIGN_ENTITLEMENTS: Config/Sift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The C ABI header and the Rust archive.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Bridge/include
          - $(SRCROOT)/Bridge
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bridge
        OTHER_LDFLAGS:
          - -force_load
          - $(SRCROOT)/Bridge/macos-universal/libsift_ffi.a
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - package: SiftModules
        product: AppShell
      - package: SiftModules
        product: Core
      - package: SiftModules
        product: Shared
    preBuildScripts:
      - name: Build Rust scanner core
        basedOnDependencyAnalysis: false
        script: |
          # The package links the archive at a fixed path, so it has to exist
          # before the first compile. Building it here keeps "open the project and
          # press Run" working on a fresh checkout.
          set -euo pipefail
          ARCHIVE="${SRCROOT}/Bridge/macos-universal/libsift_ffi.a"
          if [[ ! -f "${ARCHIVE}" ]]; then
            "${SRCROOT}/Scripts/build-rust-core.sh"
          fi

  SiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siftmac.cleaner.tests
        # Code signing needs an Info.plist; Xcode can generate one for a bundle
        # that has no settings of its own.
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Bridge/include
          - $(SRCROOT)/Bridge
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bridge
        # The bundle loads the app's symbols through TEST_HOST/BUNDLE_LOADER
        # (XcodeGen sets both for a unit-test target that depends on the app), so
        # it must not link the package products or the Rust archive a second
        # time: Xcode refuses a static product linked by both the app and its
        # test bundle, and a second copy would be wasted space at best.
    dependencies:
      - target: Sift

  SiftUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siftmac.cleaner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sift
    dependencies:
      - target: Sift

schemes:
  Sift:
    build:
      targets:
        Sift: all
        SiftTests: [test]
        SiftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Config/Sift.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
